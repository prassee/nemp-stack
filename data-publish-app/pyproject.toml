[project]
name = "data-publish-app"
version = "0.1.0"
description = "Sample Temporal workflow for data publishing"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "temporalio[opentelemetry]>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
