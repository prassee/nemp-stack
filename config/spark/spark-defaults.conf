# Spark defaults configuration for MinIO integration

# Iceberg JARs (pre-loaded to avoid downloading at runtime)
spark.jars=/opt/spark-jars/iceberg-spark-runtime-3.5_2.12-1.7.1.jar,/opt/spark-jars/iceberg-aws-bundle-1.7.1.jar

# Event logging for History Server
spark.eventLog.enabled=true
spark.eventLog.dir=s3a://spark-logs/
spark.history.fs.logDirectory=s3a://spark-logs/
spark.history.ui.port=18080

# S3A/MinIO configuration
spark.hadoop.fs.s3a.endpoint=http://minio:9000
spark.hadoop.fs.s3a.access.key=minioadmin
spark.hadoop.fs.s3a.secret.key=minioadmin
spark.hadoop.fs.s3a.path.style.access=true
spark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.connection.ssl.enabled=false

# AWS SDK v2 settings (required for newer Spark/Hadoop versions)
spark.hadoop.fs.s3a.aws.credentials.provider=org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider

# Spark SQL Extensions for Iceberg
spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

# Lakekeeper Iceberg REST Catalog configuration
spark.sql.catalog.lakekeeper=org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lakekeeper.type=rest
spark.sql.catalog.lakekeeper.uri=http://lakekeeper:8181/catalog
spark.sql.catalog.lakekeeper.warehouse=warehouse
spark.sql.catalog.lakekeeper.io-impl=org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.lakekeeper.s3.endpoint=http://minio:9000
spark.sql.catalog.lakekeeper.s3.access-key-id=minioadmin
spark.sql.catalog.lakekeeper.s3.secret-access-key=minioadmin
spark.sql.catalog.lakekeeper.s3.path-style-access=true

# Default catalog
spark.sql.defaultCatalog=lakekeeper
