version: "3.8"

# name: nmt-stack

networks:
  default:
    driver: bridge
    # driver_opts:
    # com.docker.network.bridge.enable_ip_masquerade: "true"

services:
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./data/minio:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set minio http://minio:9000 minioadmin minioadmin &&
      /usr/bin/mc mb minio/warehouse --ignore-existing &&
      echo 'MinIO buckets initialized'
      "
    restart: on-failure

  lakekeeper-db:
    image: postgres:17-alpine
    container_name: lakekeeper-db
    environment:
      POSTGRES_USER: lakekeeper
      POSTGRES_PASSWORD: lakekeeper
      POSTGRES_DB: lakekeeper
    volumes:
      - ./data/lakekeeper-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lakekeeper -d lakekeeper"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  lakekeeper:
    image: quay.io/lakekeeper/catalog:latest
    container_name: lakekeeper
    ports:
      - "8181:8181"
    environment:
      LAKEKEEPER__PG_ENCRYPTION_KEY: "this-is-NOT-secure-change-in-prod"
      LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://lakekeeper:lakekeeper@lakekeeper-db:5432/lakekeeper
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://lakekeeper:lakekeeper@lakekeeper-db:5432/lakekeeper
      RUST_LOG: info,lakekeeper=debug
    command: ["serve"]
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 5s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      lakekeeper-db:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: always

  clickhouse:
    image: clickhouse/clickhouse-server:head
    container_name: clickhouse
    ports:
      - "8123:8123"
      - "9009:9000"
    environment:
      CLICKHOUSE_DEFAULT_PASSWORD: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: default
      CLICKHOUSE_DB: default
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./data/clickhouse:/var/lib/clickhouse
      - ./config/clickhouse/config.xml:/etc/clickhouse-server/config.d/iceberg.xml:ro
      - ./config/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    depends_on:
      lakekeeper:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: >
      sh -c "
        echo 'Waiting for other services to be ready...' &&
        sleep 15 &&
        /entrypoint.sh
      "
    restart: unless-stopped

  mysql:
    image: mysql:8-oracle
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_USER: mysql
      MYSQL_PASSWORD: mysql
      MYSQL_DATABASE: mysql
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./scripts/init-cdc.sql:/docker-entrypoint-initdb.d/init-cdc.sql
      - ./config/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -pmysql"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  source-mysql:
    image: olakego/source-mysql:latest
    container_name: source-mysql
    volumes:
      - ./olake-config/config:/mnt/config
    command: ["discover"]
    restart: "no"

  temporal:
    image: docker.io/temporalio/admin-tools:latest
    container_name: temporal
    ports:
      - "7233:7233"
      - "8233:8233"
    volumes:
      - ./data/temporal:/data
    entrypoint: /usr/local/bin/temporal
    command: server start-dev --ip 0.0.0.0 --ui-port 8233 --db-filename /data/temporal.db
    restart: unless-stopped

  tabix:
    image: spoonest/clickhouse-tabix-web-client
    container_name: tabix
    ports:
      - "8088:80"
    environment:
      - CLICKHOUSE_HOST=http://clickhouse:8123
    depends_on:
      - clickhouse
    restart: unless-stopped
