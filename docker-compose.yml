version: "3.8"

name: nmt-stack

services:
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./data/minio:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set minio http://minio:9000 minioadmin minioadmin &&
      /usr/bin/mc mb minio/warehouse --ignore-existing &&
      echo 'MinIO warehouse bucket initialized'
      "
    restart: on-failure

  polaris-db:
    image: postgres:15-alpine
    container_name: polaris-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: POLARIS
    volumes:
      - ./data/polaris-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d POLARIS"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  polaris:
    image: apache/polaris:1.2.0-incubating
    container_name: polaris
    ports:
      - "8181:8181"
      - "8182:8182"
    environment:
      # PostgreSQL database configuration per official docs
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://polaris-db:5432/POLARIS
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: postgres
      # Default root credentials
      CLIENT_ID: root
      CLIENT_SECRET: s3cr3t
      # S3/MinIO configuration for warehouse
      AWS_S3_ENDPOINT: http://minio:9000
      AWS_REGION: us-east-1
      AWS_S3_REGION: us-east-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_S3_PATH_STYLE_ACCESS: "true"
      # Java system property for AWS region
      JAVA_OPTS: "-Daws.region=us-east-1"
    depends_on:
      minio:
        condition: service_healthy
      polaris-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "-w", "%{http_code}", "http://localhost:8181/iceberg/v1/config/warehouse/default"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  polaris-init:
    image: alpine:latest
    container_name: polaris-init
    depends_on:
      polaris:
        condition: service_healthy
    command: >
      sh -c "
      apk add --no-cache curl &&
      curl -X POST
      -H 'Content-Type: application/json'
      -d '{\"catalog\": {\"name\": \"default\", \"properties\": {\"warehouse-location\": \"s3://warehouse\", \"s3.endpoint\": \"http://minio:9000\", \"s3.region\": \"us-east-1\"}}}'
      http://polaris:8181/api/management/v1/catalogs &&
      echo 'Polaris default catalog created'
      "
    restart: on-failure
